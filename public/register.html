<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register for an event · Harbour Hope</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>Harbour Hope</a>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Home</a><a href="search.html">Search events</a>
        <a href="contact.html">Contact</a><a class="nav-donate" href="contact.html#donate">Donate</a><a class="nav-admin" href="admin.html">Admin</a>
      </nav>
    </div>
  </header>
  <main class="page" id="main">
    <p class="eyebrow">Save your place</p>
    <h1>Event registration</h1>
    <p class="lede">Review the event details, then enter your contact information.</p>
    <p id="register-error" class="banner error" hidden></p>
    <p id="register-success" class="banner info" hidden></p>
    <section class="ticket-box" id="selected-event">
      <p class="hint">Loading event information…</p>
    </section>
    <form id="registration-form" class="contact-form">
      <h2>Your details</h2>
      <label for="fullName">Full name *</label>
      <input id="fullName" name="fullName" type="text" minlength="2" maxlength="120" autocomplete="name" required>
      <label for="email">Email address *</label>
      <input id="email" name="email" type="email" maxlength="120" autocomplete="email" required>
      <label for="phone">Contact phone *</label>
      <input id="phone" name="phone" type="tel" minlength="5" maxlength="40" autocomplete="tel" required>
      <label for="tickets">Number of tickets *</label>
      <input id="tickets" name="tickets" type="number" min="1" max="10" value="1" required>
      <div class="form-actions">
        <button class="btn gold" type="submit" id="submit-registration">Complete registration</button>
        <a class="btn secondary" id="back-to-event" href="search.html">Back to event</a>
      </div>
    </form>
  </main>
  <footer class="site-footer"><p>Harbour Hope Foundation · PROG2002 Assessment 3</p></footer>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
